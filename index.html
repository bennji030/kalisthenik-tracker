<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calisthenics" />
    <link rel="icon" href="favicon-v2.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon-v2.png" />
    <script>
      (function () {
        var t = 'dark';
        try {
          var v = localStorage.getItem('theme');
          if (v === 'light') t = 'light';
          else if (v === 'system' && matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        } catch (e) {}
        var light = t === 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f2f2f7' : '#0e0f12');
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', light ? 'default' : 'black-translucent');
      })();
    </script>
    <title>Calisthenics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
